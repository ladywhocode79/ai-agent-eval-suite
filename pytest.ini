[pytest]
testpaths = tests

# Folder path resolution
pythonpath = .

markers =
    calibration: Verification of LLM Judge alignment against Human Gold Set (Cohens Kappa)
    evals: Layer A and Layer B scenario evaluation tests
    unit: Deterministic helper tests (no LLM calls)
    benchmark: Comparative cost, latency, and accuracy benchmark

asyncio_mode = auto

# Live logging configuration
log_cli = true
log_cli_level = INFO

# Combined options: Parallel execution + Report generation
addopts = -n auto --dist loadscope --html=reports/report.html --self-contained-html --junitxml=reports/report.xml